<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f8f8; padding: 30px; }
        h1 { color: #333; text-align: center; }
        table { width: 60%; margin: 20px auto; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #ccc; }
        th { background-color: #4CAF50; color: white; }
        .present { color: green; font-weight: bold; }
        .absent { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Class Attendance</h1>
    <table>
        <tr>
            <th>Student Name</th>
            <th>Status</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td class="{{ student.status|lower }}">{{ student.status }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
